<!doctype html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:"SERIF";src:url("assets/fonts/SourceSerif4.ttf");font-weight:200 900}
@font-face{font-family:"SANS";src:url("assets/fonts/Inter.ttf");font-weight:100 900}
html,body{margin:0;width:1080px;height:1080px;background:#0b1622;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.top{font-family:"SANS";font-weight:800;font-size:92px;letter-spacing:.2em;color:#fff;margin-left:.2em}
.bar{width:150px;height:14px;background:#c8102e;margin:34px 0 26px}
.big{font-family:"SERIF";font-weight:700;font-size:250px;line-height:.9;color:#fff;letter-spacing:-.01em}
</style></head><body><div class="wrap" id="w"></div>
<script>
const q=new URLSearchParams(location.search);
const [a,b]=q.get("lang")==="es"?["HOY EN","Corea"]:["KORE'DE","Bugün"];
document.getElementById("w").innerHTML=`<div class="top">${a}</div><div class="bar"></div><div class="big">${b}</div>`;
</script></body></html>
